name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the project claims to support, and current.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No install step: the project is standard library only.
      - name: Test
        run: python -m unittest discover -s tests -t . -v

      - name: Build the standalone executable
        run: make build

      - name: The built executable runs without herdr present
        run: |
          ! ./build/nodder --status
          ./build/nodder --help
